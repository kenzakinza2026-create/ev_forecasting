services:
  minio:
    image: minio/minio:latest
    container_name: dcforecaster-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: dcforecaster-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/mlflow-artifacts &&
      echo 'Bucket ready' ||
      (echo 'FAILED to create bucket' && exit 1)
      "
    restart: "no"

  api:
    build: .
    container_name: dcforecaster-api
    ports:
      - "8000:8000"
    volumes:
      - ./history.csv:/app/history.csv
      - ./predictions_log.csv:/app/predictions_log.csv
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    depends_on:
      - mlflow-ui
    restart: unless-stopped

  mlflow-ui:
    build: .
    container_name: dcforecaster-mlflow-ui
    command: >
      mlflow server
      --backend-store-uri file:///app/mlflow_data/mlruns
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlflow_data/mlruns
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    depends_on:
      - minio
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # NOUVEAU : lance track.py automatiquement dans le réseau Docker, une
  # seule fois au démarrage (job, pas un serveur -> restart: "no").
  # Remplace le lancement manuel de track.py depuis le venv local.
  # Le nom du CSV vient de la variable TRACK_CSV définie dans .env,
  # pour pouvoir passer du CSV de test au CSV de production sans
  # toucher ce fichier.
  # ---------------------------------------------------------------------
  tracker-init:
    build: .
    container_name: dcforecaster-tracker-init
    command: sh -c "python track.py --csv ${TRACK_CSV} --horizon 96"
    volumes:
      - ./${TRACK_CSV}:/app/${TRACK_CSV}
      - ./prediction_logs:/app/prediction_logs
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - PUSHGATEWAY_URL=pushgateway:9091
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlflow-ui:
        condition: service_started
    restart: "no"

  # ---------------------------------------------------------------------
  # v3 : suivi MLflow du nouveau modele Q95 (DCForecaster_v3).
  # Image separee (Python 3.12, xgboost 3.3.0, pandas 2.3.3) construite
  # depuis ./model avec Dockerfile.v3. N'affecte pas api, mlflow-ui ni
  # tracker-init (ancienne version v2).
  # Ne demarre jamais avec "docker compose up" (profil "v3"). Lancement :
  #   docker compose build tracker-v3
  #   docker compose run --rm tracker-v3
  # --no-promote : l'alias @production n'est pas deplace.
  # ---------------------------------------------------------------------
  tracker-v3:
    profiles: ["v3"]
    build:
      context: ./model
      dockerfile: Dockerfile.v3
    command: >
      python track.py --pipeline dc
      --csv data/processed/ml_features_dc_train_val.csv
      --horizon 16 --eval-days 60
      --no-promote --model-name DCForecaster_v3
    volumes:
      - ./model/data:/app/data
      - ./prediction_logs:/app/prediction_logs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - PUSHGATEWAY_URL=pushgateway:9091
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlflow-ui:
        condition: service_started
      pushgateway:
        condition: service_started
    restart: "no"

  evidently-init:
    build: .
    container_name: dcforecaster-evidently-init
    command: >
      sh -c "python Drift_report.py --csv ${TRACK_CSV} --current-slots 96
      --output-dir drift_reports --log-mlflow"
    volumes:
      - ./${TRACK_CSV}:/app/${TRACK_CSV}
      - ./drift_reports:/app/drift_reports
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - PUSHGATEWAY_URL=pushgateway:9091
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlflow-ui:
        condition: service_started
      pushgateway:
        condition: service_started
    restart: "no"

  pushgateway:
    image: prom/pushgateway:latest
    container_name: dcforecaster-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dcforecaster-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dcforecaster-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  dashboard:
    build:
      context: ./mlops-dashboard
    container_name: dcforecaster-dashboard
    ports:
      - "8080:8080"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
      - PROMETHEUS_URL=http://prometheus:9090
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - MINIO_BUCKET=mlflow-artifacts
      - DRIFT_REPORTS_DIR=/app/drift_reports
    volumes:
      - ./drift_reports:/app/drift_reports:ro
    depends_on:
      mlflow-ui:
        condition: service_started
      prometheus:
        condition: service_started
      minio:
        condition: service_started
      evidently-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  minio_data:
  prometheus_data:
  grafana_data:
