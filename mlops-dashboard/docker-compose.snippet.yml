# À copier-coller dans le fichier docker-compose.yml existant du projet
# (au même niveau que mlflow-ui, minio, prometheus, grafana, api)

  dashboard:
    build:
      context: ./mlops-dashboard
    container_name: dcforecaster-dashboard
    ports:
      - "8080:8080"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
      - PROMETHEUS_URL=http://prometheus:9090
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - MINIO_BUCKET=mlflow-artifacts
      - DRIFT_REPORTS_DIR=/app/drift_reports
    volumes:
      - ./drift_reports:/app/drift_reports:ro
    depends_on:
      - mlflow-ui
      - prometheus
      - minio
    restart: unless-stopped

# N'oublie pas aussi, sur le service "grafana" existant, d'ajouter :
#   environment:
#     GF_SECURITY_ADMIN_PASSWORD: admin123
#     GF_SECURITY_ALLOW_EMBEDDING: "true"
# (sinon Grafana refuse d'être affiché en iframe dans /grafana)
